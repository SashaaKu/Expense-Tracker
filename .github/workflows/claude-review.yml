# Automatic Claude code review on pull requests.
# Based on "Automatic PR Code Review" in
# https://github.com/anthropics/claude-code-action/blob/main/docs/solutions.md
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # check out the code
      pull-requests: write  # post review comments
      id-token: write       # OIDC exchange for the Claude GitHub App token
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in the current working directory.

            1. Read CLAUDE.md in the repository root. Its rules are the project's standards.
            2. Get the diff with `gh pr diff ${{ github.event.pull_request.number }}`. Read full files with the Read tool when you need context.
            3. Review ONLY the changed code, focusing on:
               - Bugs: logic errors, wrong conditions, null/edge cases, data loss, race conditions, broken API contracts.
               - Security:
                 - Secrets must never be committed. Flag as critical any added or modified file under secrets/,
                   any *.pem file, any *.db / *.db-wal / *.db-shm file, and any hardcoded credential,
                   key, token or application id (config must come from dotnet user-secrets, see CLAUDE.md).
                 - Injection, unsafe deserialization, missing validation of external input.
               - Error handling: swallowed exceptions, missing failure paths, unclear error messages,
                 failures that leave data in an inconsistent state.
               - Violations of the CLAUDE.md rules (e.g. duplicated logic that belongs in a helper).
            4. Do NOT comment on style, formatting, naming or personal preferences. No nitpicks.
               Only report issues you are confident are real; say briefly why each one matters.

            Posting:
            - Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for each specific issue, on the relevant line.
            - Then post ONE short top-level summary with `gh pr comment` (issue count by severity, or that no issues were found). Do not repeat the inline comments in it.
            - Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read"
